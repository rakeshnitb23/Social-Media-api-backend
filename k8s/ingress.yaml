apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: social-media-api-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: api.socialmedia.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: social-media-api-service
            port:
              number: 80
